name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the previous run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build, types, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (from the committed lockfile)
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Regression tests (security + unit)
        run: npm test

      - name: Build
        # Placeholders; the build only needs them to exist.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Dependency audit (fails on critical)
        # TODO: raise to high after upgrading next past 16 (accepted postcss
        # advisory GHSA-r28c-9q8g-f849, fixed only in next's next major).
        run: npm audit --audit-level=critical

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tenant isolation + schema-readiness tests
        # No credentials on purpose: the suites must pass with no external services.
        run: python tests/test_isolation.py

      - name: Scoped database client tests
        run: python tests/test_scoped_db.py

      - name: Timestamp tests
        run: python tests/test_timestamps.py

      - name: Rate limiter tests
        run: python tests/test_rate_limit.py

      - name: Account deletion tests
        run: python tests/test_account_delete.py

      - name: Spend guard tests
        run: python tests/test_spend_guard.py

      - name: Moderation tests
        run: python tests/test_moderation.py

      - name: Security audit log tests
        run: python tests/test_audit.py

      - name: Product analytics tests
        run: python tests/test_analytics.py

      - name: Research failure tests
        run: python tests/test_research_failures.py

      - name: Answer feedback tests
        run: python tests/test_feedback.py

      - name: Error tracking tests
        run: python tests/test_observability.py

      - name: Benchmark script tests
        run: python tests/test_benchmark.py

      - name: Staging smoke script tests
        run: python tests/test_smoke.py

  backend-image:
    name: Backend image (build, health, stop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t vettan-backend backend

      - name: No secrets or tests in the image, not running as root
        run: docker run --rm vettan-backend sh -c 'test ! -e .env && test ! -e tests && test "$(id -u)" != 0'

      - name: Starts and answers /health
        # Placeholder keys only; no Supabase, so /health reports "degraded" with a 200.
        run: |
          docker run -d --name api -p 8000:8000 \
            -e OPENAI_API_KEY=test -e TAVILY_API_KEY=test vettan-backend
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

      - name: Stops cleanly on SIGTERM
        # Exit code 137 would mean uvicorn never got the signal and was killed.
        run: |
          docker stop api
          code=$(docker inspect -f '{{.State.ExitCode}}' api)
          docker logs api | tail -5
          test "$code" = 0

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
