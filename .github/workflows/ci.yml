name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the previous run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build, types, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (from the committed lockfile)
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Regression tests (security + unit)
        run: npm test

      - name: Build
        # Placeholders; the build only needs them to exist.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

      - name: Dependency audit (fails on critical)
        # TODO: raise to high after upgrading next past 16 (accepted postcss
        # advisory GHSA-r28c-9q8g-f849, fixed only in next's next major).
        run: npm audit --audit-level=critical

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tenant isolation + schema-readiness tests
        # No credentials on purpose: the suites must pass with no external services.
        run: python tests/test_isolation.py

      - name: Rate limiter tests
        run: python tests/test_rate_limit.py

      - name: Account deletion tests
        run: python tests/test_account_delete.py

      - name: Spend guard tests
        run: python tests/test_spend_guard.py

      - name: Moderation tests
        run: python tests/test_moderation.py

      - name: Security audit log tests
        run: python tests/test_audit.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
