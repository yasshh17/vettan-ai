version: 2
updates:
  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Group patch/minor bumps weekly; majors get their own PR.
      routine-updates:
        update-types: ["minor", "patch"]

  # Backend (pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      routine-updates:
        update-types: ["minor", "patch"]

  # Backend base image (the digest pinned in backend/Dockerfile)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    # A new Python minor also needs .python-version, runtime.txt and CI changed, so do it by hand.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # GitHub Actions themselves (e.g. actions/checkout, gitleaks-action)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
