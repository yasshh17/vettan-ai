version: 2
updates:
  # Frontend (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Group patch/minor bumps weekly; majors get their own PR.
      routine-updates:
        update-types: ["minor", "patch"]

  # Backend (pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      routine-updates:
        update-types: ["minor", "patch"]

  # GitHub Actions themselves (e.g. actions/checkout, gitleaks-action)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
